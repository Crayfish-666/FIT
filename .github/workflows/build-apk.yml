name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: FIT-APP-Android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check Release Signing Secrets
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "::error::发布正式版 Release 需要先在 GitHub 仓库配置四个签名 Secrets（ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD）。"
              exit 1
            fi
          fi

      - name: Install Dependencies & Prepare Capacitor Android
        run: |
          npm install
          npm run prepare-www
          npx cap add android
          npx --no-install capacitor-assets generate --android --assetPath resources
          npx cap sync android

      - name: Patch Android Version Metadata
        run: |
          python3 - <<'PY'
          import os, re
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", ref_name)
          if m:
              ver_name = f"{m.group(1)}.{m.group(2)}.{m.group(3)}"
              ver_code = int(m.group(1)) * 10000 + int(m.group(2)) * 100 + int(m.group(3))
          else:
              ver_name = f"1.0.0-dev.{run_num}"
              ver_code = run_num

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              txt = f.read()
          txt = re.sub(r"versionCode\s+\d+", f"versionCode {ver_code}", txt, count=1)
          txt = re.sub(r'versionName\s+"[^"]+"', f'versionName "{ver_name}"', txt, count=1)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(txt)
          print(f"Patched Android versionCode={ver_code}, versionName={ver_name}")
          PY

      - name: Build Signed Release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          echo "$KS_B64" | tr -d ' \n\r' | base64 --decode > android/app/release.jks
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease)

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          VER_TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VER_TAG="v1.0.0-build${GITHUB_RUN_NUMBER}"
          fi
          OUT_APK="dist/FIT-${VER_TAG}-release.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks android/app/release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT_APK" \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify -v "$OUT_APK"
          rm -f android/app/release.jks

      - name: Build Verification Debug APK (When Signing Secrets Not Yet Configured)
        if: steps.signing.outputs.configured != 'true'
        run: |
          mkdir -p dist
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/FIT-dev-debug.apk"

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIT-Android-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "FIT 刷题 ${{ github.ref_name }}"
          body: |
            ### 更新说明
            - 瑞士极简主义界面重构（支持深/浅双模式、0px 锐利网格排版）
            - 第一章《文档处理》全部 4 节共 221 题完整题库（含高清配图放大预览）
            - 支持顺序、仅刷未做、随机乱序、按题型专练与背题模式
            - 错题本三级筛选与专练、搜题收藏、JSON 备份导入导出
            - 使用正式签名证书构建，后续新版本可直接覆盖安装保留本地做题记录
          files: dist/*.apk
